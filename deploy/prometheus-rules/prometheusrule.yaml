apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubevirt-metrics-exporter-alerts
  namespace: kubevirt-metrics-exporter
  labels:
    app.kubernetes.io/name: kubevirt-metrics-exporter
spec:
  groups:
    # Consolidate qualified workload signals; suppress only covered conditions.
    # Intermediate records retain identity without requiring PVC metadata.
    # Read/write and block summaries use >1% above 100ms; compare increases
    # directly to avoid rate-conversion rounding at an exactly 1% tail.
    # Flush/NFS retain estimated P99 thresholds of 500ms/250ms. Quantiles use
    # all buckets and accept both 1 and 1.0 as the one-second boundary.
    # Histogram summaries require >=100 operations per disk/pod-volume in 5m,
    # except flush, which uses its 10m P99 window.
    # Timestamp state tolerates evaluation gaps shorter than 2m; evaluated absence resets workload state.
    - name: kubevirt-storage-io.rules
      interval: 30s
      rules:
        - record: pvc:kme_storageclass:info
          expr: >
            ((max by (namespace, persistentvolumeclaim, storageclass)
            (kube_persistentvolumeclaim_info{persistentvolumeclaim!=""} and
            (timestamp(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}) > time() - 120))) or ((max by
            (namespace, persistentvolumeclaim, storageclass)
            (last_over_time(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}[2m]))) unless on
            (namespace, persistentvolumeclaim) (max by (namespace, persistentvolumeclaim, storageclass)
            (kube_persistentvolumeclaim_info{persistentvolumeclaim!=""} and
            (timestamp(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}) > time() - 120)))))

            and on (namespace, persistentvolumeclaim) (count by (namespace, persistentvolumeclaim) ((max by
            (namespace, persistentvolumeclaim, storageclass)
            (kube_persistentvolumeclaim_info{persistentvolumeclaim!=""} and
            (timestamp(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}) > time() - 120))) or ((max by
            (namespace, persistentvolumeclaim, storageclass)
            (last_over_time(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}[2m]))) unless on
            (namespace, persistentvolumeclaim) (max by (namespace, persistentvolumeclaim, storageclass)
            (kube_persistentvolumeclaim_info{persistentvolumeclaim!=""} and
            (timestamp(kube_persistentvolumeclaim_info{persistentvolumeclaim!=""}) > time() - 120))))) == 1)
        - record: pod:kme_vmi:info
          expr: |
            label_replace(
              max by (namespace, vmi_pod, name) (
                last_over_time(kubevirt_vmi_info{phase="running",vmi_pod!=""}[5m])
              ),
              "pod", "$1", "vmi_pod", "(.*)"
            )
        - record: vmi:kme_vmi_io_latency_affected:bool
          expr: |
            group without () (
              (
                sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                  increase(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                )
                /
                sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                  increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                )
              ) < 0.99
              and
              (sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )
        - record: vmi:kme_vmi_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )
        - record: vmi:kme_vmi_flush_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation, le) (
              increase(kubevirt_vmi_storage_io_latency_seconds_bucket{operation="flush"}[10m])
            ))
        - record: vmi:kme_vmi_flush_latency_affected:bool
          expr: |
            group without () (
              (vmi:kme_vmi_flush_latency:p99_seconds > 0.5)
              and
              (sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[10m])
              ) >= 100)
            )
        - record: vmi:kme_vmi_flush_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[10m])
              ) >= 100
            )
        - record: pod:kme_block_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, node, persistentvolumeclaim, pod, operation, le) (
              rate(kme_block_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))
        - record: pod:kme_block_io_latency_affected:bool
          expr: |
            group without () (
              (
                sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                  increase(kme_block_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                )
                /
                sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                  increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                )
              ) < 0.99
              and
              (sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )
        - record: vmi:kme_block_io_latency_affected:bool
          expr: |
            group without () (
              pod:kme_block_io_latency_affected:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )
        - record: pod:kme_block_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )
        - record: vmi:kme_block_io_latency_active:bool
          expr: |
            group without () (
              pod:kme_block_io_latency_active:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )
        - record: pod:kme_nfs_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, node, persistentvolumeclaim, pod, operation, le) (
              increase(kme_nfs_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))
        - record: pod:kme_nfs_io_latency_affected:bool
          expr: |
            group without () (
              (pod:kme_nfs_latency:p99_seconds > 0.25)
              and
              (sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )
        - record: vmi:kme_nfs_io_latency_affected:bool
          expr: |
            group without () (
              pod:kme_nfs_io_latency_affected:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )
        - record: pod:kme_nfs_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )
        - record: vmi:kme_nfs_io_latency_active:bool
          expr: |
            group without () (
              pod:kme_nfs_io_latency_active:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )
        - record: vmi:kme_guest_latency_affected:bool
          expr: |
            group without () (kubevirt_vmi_storage_guest_latency_avg_seconds > 0.1)
        - record: vmi:kme_guest_latency_active:bool
          expr: |
            group without () (kubevirt_vmi_storage_guest_latency_avg_seconds)
        - record: vmi:kme_node_io_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, le) (
              rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))
        - record: vmi:kme_node_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node) (
                rate(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) > 0
            )
        - record: storageclass:kme_vmi_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_vmi_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_vmi_flush_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_flush_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_vmi_flush_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_flush_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_block_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_block_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_block_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_block_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_nfs_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_nfs_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_nfs_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_nfs_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_guest_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_guest_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: storageclass:kme_guest_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_guest_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  pvc:kme_storageclass:info{storageclass!=""}
              )
            )
        - record: kme:storage_latency:seconds
          expr: histogram_quantile(0.99, sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation, le)
            (rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write"}[5m]))) or vmi:kme_vmi_flush_latency:p99_seconds
          labels:
            signal: qmp
        - record: kme:storage_latency:seconds
          expr: kubevirt_vmi_storage_guest_latency_avg_seconds
          labels:
            signal: guest
        - record: kme:storage_latency:seconds
          expr: pod:kme_block_latency:p99_seconds
          labels:
            signal: block
        - record: kme:storage_latency:seconds
          expr: pod:kme_nfs_latency:p99_seconds
          labels:
            signal: nfs
        - record: kme:storage_latency_condition_10m:bool
          expr: group without () (kme:storage_latency:seconds{signal="qmp",operation=~"read|write"} > .1)
          labels:
            signal: qmp
        - record: kme:storage_latency_condition_15m:bool
          expr: group without () (kme:storage_latency:seconds{signal="qmp",operation="flush"} > .5)
          labels:
            signal: qmp
            operation: flush
        - record: kme:storage_latency_condition_15m:bool
          expr: group without () (kme:storage_latency:seconds{signal="guest"} > .1)
          labels:
            signal: guest
        - record: kme:storage_latency_condition_10m:bool
          expr: group without () (kme:storage_latency:seconds{signal="block"} > .1)
          labels:
            signal: block
        - record: kme:storage_latency_condition_10m:bool
          expr: group without () (kme:storage_latency:seconds{signal="nfs"} > .25)
          labels:
            signal: nfs
        # State value is the first breach timestamp; -1 records evaluated recovery.
        # Read our previous samples only within 2m, avoiding permanent state after outages.
        - record: kme:storage_latency_since_10m:seconds
          expr: |
            (
              (last_over_time(kme:storage_latency_since_10m:seconds[2m]) >= 0)
              and (kme:storage_latency_condition_10m:bool and (timestamp(kme:storage_latency_condition_10m:bool) > time() - 120))
            )
            or (time() + 0 * (kme:storage_latency_condition_10m:bool and (timestamp(kme:storage_latency_condition_10m:bool) > time() - 120)))
            or (-1 + 0 * ((last_over_time(kme:storage_latency_since_10m:seconds[2m]) >= 0)
              unless (kme:storage_latency_condition_10m:bool and (timestamp(kme:storage_latency_condition_10m:bool) > time() - 120))))
        - record: kme:storage_latency_since_15m:seconds
          expr: |
            (
              (last_over_time(kme:storage_latency_since_15m:seconds[2m]) >= 0)
              and (kme:storage_latency_condition_15m:bool and (timestamp(kme:storage_latency_condition_15m:bool) > time() - 120))
            )
            or (time() + 0 * (kme:storage_latency_condition_15m:bool and (timestamp(kme:storage_latency_condition_15m:bool) > time() - 120)))
            or (-1 + 0 * ((last_over_time(kme:storage_latency_since_15m:seconds[2m]) >= 0)
              unless (kme:storage_latency_condition_15m:bool and (timestamp(kme:storage_latency_condition_15m:bool) > time() - 120))))
        - record: kme:storage_latency_qualified:bool
          expr: |
            group without () ((kme:storage_latency_since_10m:seconds >= 0) and (time() - kme:storage_latency_since_10m:seconds >= 600))
            or
            group without () ((kme:storage_latency_since_15m:seconds >= 0) and (time() - kme:storage_latency_since_15m:seconds >= 900))
        - record: kme:storage_latency_recently_qualified:bool
          expr: |
            (kme:storage_latency_qualified:bool and (kme:storage_latency_since_10m:seconds >= 0) and (time() - kme:storage_latency_since_10m:seconds < 690))
            or
            (kme:storage_latency_qualified:bool and (kme:storage_latency_since_15m:seconds >= 0) and (time() - kme:storage_latency_since_15m:seconds < 990))
        - record: storageclass:kme_latency_affected:count
          expr: |
            storageclass:kme_vmi_io_latency_affected:count or storageclass:kme_vmi_flush_latency_affected:count
          labels:
            signal: qmp
        - record: storageclass:kme_latency_affected:count
          expr: |
            storageclass:kme_block_io_latency_affected:count
          labels:
            signal: block
        - record: storageclass:kme_latency_affected:count
          expr: |
            storageclass:kme_nfs_io_latency_affected:count
          labels:
            signal: nfs
        - record: storageclass:kme_latency_affected:count
          expr: |
            storageclass:kme_guest_latency_affected:count
          labels:
            signal: guest
        - record: storageclass:kme_latency_active:count
          expr: |
            storageclass:kme_vmi_io_latency_active:count or storageclass:kme_vmi_flush_latency_active:count
          labels:
            signal: qmp
        - record: storageclass:kme_latency_active:count
          expr: |
            storageclass:kme_block_io_latency_active:count
          labels:
            signal: block
        - record: storageclass:kme_latency_active:count
          expr: |
            storageclass:kme_nfs_io_latency_active:count
          labels:
            signal: nfs
        - record: storageclass:kme_latency_active:count
          expr: |
            storageclass:kme_guest_latency_active:count
          labels:
            signal: guest
        - record: storageclass:kme_latency_condition:bool
          expr: |
            group without () (storageclass:kme_latency_affected:count >= 10 or
            ((storageclass:kme_latency_affected:count / storageclass:kme_latency_active:count >= 0.1)
            and (storageclass:kme_latency_affected:count >= 3)))
        - record: storageclass:kme_latency_since:seconds
          expr: |
            (
              (last_over_time(storageclass:kme_latency_since:seconds[2m]) >= 0)
              and (storageclass:kme_latency_condition:bool and (timestamp(storageclass:kme_latency_condition:bool) > time() - 120))
            )
            or (time() + 0 * (storageclass:kme_latency_condition:bool and (timestamp(storageclass:kme_latency_condition:bool) > time() - 120)))
            or (-1 + 0 * ((last_over_time(storageclass:kme_latency_since:seconds[2m]) >= 0)
              unless (storageclass:kme_latency_condition:bool and (timestamp(storageclass:kme_latency_condition:bool) > time() - 120))))
        # Once qualified, renew this timestamp while the condition is true.
        # Brief interruptions retain the last qualification; different sources cannot share state.
        - record: storageclass:kme_latency_last_qualified:seconds
          expr: |
            time() + 0 * (
              (storageclass:kme_latency_condition:bool and (timestamp(storageclass:kme_latency_condition:bool) > time() - 120))
              and (
                ((storageclass:kme_latency_since:seconds >= 0) and (time() - storageclass:kme_latency_since:seconds >= 600))
                or (last_over_time(storageclass:kme_latency_last_qualified:seconds[2m]) > time() - 120)
              )
            )
        - record: storageclass:kme_latency_qualified:bool
          expr: |
            group without () (last_over_time(storageclass:kme_latency_last_qualified:seconds[2m]) > time() - 120)
        - record: kme:storage_latency_summary_member:bool
          expr: |-
            (vmi:kme_vmi_io_latency_affected:bool)
            or
            (vmi:kme_vmi_flush_latency_affected:bool)
          labels:
            signal: qmp
        - record: kme:storage_latency_summary_member:bool
          expr: vmi:kme_guest_latency_affected:bool
          labels:
            signal: guest
        - record: kme:storage_latency_summary_member:bool
          expr: pod:kme_block_io_latency_affected:bool
          labels:
            signal: block
        - record: kme:storage_latency_summary_member:bool
          expr: pod:kme_nfs_io_latency_affected:bool
          labels:
            signal: nfs
        - record: kme:storage_latency_covered:bool
          expr: |-
            (
              kme:storage_latency_qualified:bool{persistentvolumeclaim!=""}
              and on (namespace, name, node, pod, disk, drive, persistentvolumeclaim, operation, signal)
                kme:storage_latency_summary_member:bool
            )
            * on (namespace, persistentvolumeclaim) group_left(storageclass)
              pvc:kme_storageclass:info{storageclass!=""}
            and on (storageclass, operation, signal) storageclass:kme_latency_qualified:bool
        - record: kme:storage_latency_waiting:bool
          expr: |
            (
              kme:storage_latency_recently_qualified:bool{persistentvolumeclaim!=""}
              and on (namespace, name, node, pod, disk, drive, persistentvolumeclaim, operation, signal)
                kme:storage_latency_summary_member:bool
            )
            * on (namespace, persistentvolumeclaim) group_left(storageclass)
              pvc:kme_storageclass:info{storageclass!=""}
            and on (storageclass, operation, signal) storageclass:kme_latency_condition:bool
        - record: kme:storage_latency_uncovered:bool
          expr: |-
            kme:storage_latency_qualified:bool
            unless on (namespace, name, node, pod, disk, drive, persistentvolumeclaim, operation, signal) (
              (kme:storage_latency_covered:bool{signal=~"qmp|guest"} or kme:storage_latency_waiting:bool{signal=~"qmp|guest"})
              or (
                (kme:storage_latency_covered:bool{signal=~"block|nfs"} or kme:storage_latency_waiting:bool{signal=~"block|nfs"})
                and on (namespace, pod) pod:kme_vmi:info
              )
            )
        - record: vmi:kme_storage_latency_uncovered:bool
          expr: |-
            group by (namespace, name, operation) (
              kme:storage_latency_uncovered:bool{name!=""}
              or
              (
                kme:storage_latency_uncovered:bool{name="",pod!=""}
                * on (namespace, pod) group_left(name) pod:kme_vmi:info
              )
            )
        - record: pod:kme_storage_latency_uncovered:bool
          expr: |-
            group by (namespace, pod, operation) (
              kme:storage_latency_uncovered:bool{name=""}
              unless on (namespace, pod) pod:kme_vmi:info
            )
        - record: kme:storage_latency_detail:seconds
          expr: kme:storage_latency:seconds and on (namespace, name, node, pod, disk, drive, persistentvolumeclaim, operation,
            signal) kme:storage_latency_uncovered:bool
        - record: vmi:kme_storage_latency_detail:seconds
          expr: |-
            kme:storage_latency_detail:seconds{name!=""}
            or (kme:storage_latency_detail:seconds{name="",pod!=""}
            * on (namespace, pod) group_left(name) pod:kme_vmi:info)
        - alert: VMIStorageLatencyHigh
          expr: vmi:kme_storage_latency_uncovered:bool
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
            incident: storage-latency
            scope: vmi
          annotations:
            summary: Storage {{ $labels.operation }} latency high on VMI {{ $labels.namespace }}/{{ $labels.name }}
            description: 'Sustained storage latency affects this workload. Latency shows the highest disk statistic per
              source: QMP/block/NFS P99, guest average. Inspect vmi:kme_storage_latency_detail:seconds for disk, PVC and
              node details. A matching pending shared summary can delay initial notification eligibility by at most 90
              seconds.'
            runbook_url: https://github.com/openshift-virtualization/kubevirt-metrics-exporter/blob/main/README.md#alerting
            latency: '{{ with query (printf "max by (signal) (vmi:kme_storage_latency_detail:seconds{namespace=%q,name=%q,operation=%q})"
              $labels.namespace $labels.name $labels.operation) }}{{ range sortByLabel "signal" . }}{{ .Labels.signal
              }}: {{ humanizeDuration .Value }}; {{ end }}{{ else }}Latency samples unavailable.{{ end }}'
        - alert: PodStorageLatencyHigh
          expr: pod:kme_storage_latency_uncovered:bool
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            incident: storage-latency
            scope: pod
          annotations:
            summary: Storage {{ $labels.operation }} latency high on pod {{ $labels.namespace }}/{{ $labels.pod }}
            description: 'Sustained storage latency affects this workload. Latency shows the highest disk statistic per
              source: QMP/block/NFS P99, guest average. Inspect kme:storage_latency_detail:seconds for disk, PVC and node
              details. A matching pending shared summary can delay initial notification eligibility by at most 90 seconds.'
            runbook_url: https://github.com/openshift-virtualization/kubevirt-metrics-exporter/blob/main/README.md#alerting
            latency: '{{ with query (printf "max by (signal) (kme:storage_latency_detail:seconds{namespace=%q,pod=%q,operation=%q})"
              $labels.namespace $labels.pod $labels.operation) }}{{ range sortByLabel "signal" . }}{{ .Labels.signal }}:
              {{ humanizeDuration .Value }}; {{ end }}{{ else }}Latency samples unavailable.{{ end }}'
        - alert: StorageClassLatencyHigh
          expr: group by (storageclass, operation) (storageclass:kme_latency_qualified:bool)
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            incident: storage-latency
            scope: storageclass
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: Shared {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}
            description: At least one source met the shared population threshold for 10 minutes. Counts are per source
              and must not be summed across sources. Shared state tolerates interruptions shorter than 2 minutes. Uncovered
              workloads retain individual alerts.
            runbook_url: https://github.com/openshift-virtualization/kubevirt-metrics-exporter/blob/main/README.md#alerting
            affected: '{{ with query (printf "storageclass:kme_latency_affected:count{storageclass=%q,operation=%q}" $labels.storageclass
              $labels.operation) }}{{ range sortByLabel "signal" . }}{{ .Labels.signal }}: {{ printf "%.0f" .Value }};
              {{ end }}{{ else }}Counts unavailable during recovery grace.{{ end }}'
            active: '{{ with query (printf "storageclass:kme_latency_active:count{storageclass=%q,operation=%q}" $labels.storageclass
              $labels.operation) }}{{ range sortByLabel "signal" . }}{{ .Labels.signal }}: {{ printf "%.0f" .Value }};
              {{ end }}{{ else }}Counts unavailable during recovery grace.{{ end }}'
    - name: kubevirt-storage-io
      rules:
        - alert: NodeVMStorageLatencyWidespread
          expr: |
            count by (node) (vmi:kme_node_io_latency:p99_seconds > 0.1)
            /
            count by (node) (vmi:kme_node_io_latency_active:bool) > 0.5
          for: 10m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Widespread VM storage latency on node {{ $labels.node }}"
            description: >-
              More than 50% of active VMs on node {{ $labels.node }} have P99 storage
              I/O latency exceeding 100ms, suggesting a node- or storage-infrastructure
              problem rather than a single workload issue.

        - alert: VMIDiskSaturated
          expr: |
            sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
              kubevirt_vmi_storage_queue_inuse
            )
            /
            (
              sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
                kubevirt_vmi_storage_queue_size
              ) > 0
            ) > 0.9
          for: 5m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
          annotations:
            summary: "Virtqueues saturated on {{ $labels.namespace }}/{{ $labels.name }} (bus={{ $labels.bus }}{{ if $labels.disk }}, disk={{ $labels.disk }}{{ end }})"
            description: >-
              Aggregate virtqueue occupancy (bus={{ $labels.bus }}{{ if $labels.disk }},
              disk={{ $labels.disk }}, PVC={{ $labels.persistentvolumeclaim }}{{ end }}) on VM
              {{ $labels.namespace }}/{{ $labels.name }} exceeds 90% across all
              queues, indicating sustained storage backpressure.

    - name: kubevirt-overhead
      rules:
        - alert: KSMDCPUHigh
          expr: |
            rate(kme_cgroup_ksmd_cpu_seconds_total[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "ksmd consuming >50% CPU on node {{ $labels.node }}"
            description: >-
              The ksmd kernel thread on node {{ $labels.node }} has been using
              more than 50% of a CPU core for over 10 minutes. This may indicate
              overly aggressive KSM scan parameters (pages_to_scan / sleep_millisecs)
              or a large volume of volatile pages causing excessive re-scanning.

        - alert: KhugepagedCPUHigh
          expr: |
            rate(kme_cgroup_khugepaged_cpu_seconds_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "khugepaged consuming >10% CPU on node {{ $labels.node }}"
            description: >-
              The khugepaged kernel thread on node {{ $labels.node }} has been
              using more than 10% of a CPU core for over 10 minutes. This may
              indicate excessive transparent huge page collapse activity, possibly
              due to a large number of VMs faulting memory simultaneously.

    # The job label must match the PodMonitor name in deploy/podmonitor/podmonitor.yaml.
    - name: kubevirt-metrics-exporter-health
      rules:
        - alert: KMEQMPPollStale
          expr: time() - kme_qmp_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "QMP polling stale on {{ $labels.instance }}"
            description: >-
              The QMP subsystem has not completed a poll cycle in over 5 minutes.
              VM storage metrics from this node may be stale.

        - alert: KMEQGAPollStale
          expr: time() - kme_qga_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "QGA polling stale on {{ $labels.instance }}"
            description: >-
              The QGA subsystem has not completed a poll cycle in over 5 minutes.
              Guest-side metrics from this node may be stale.

        - alert: KMEQMPScrapeErrors
          expr: |
            rate(kme_qmp_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained QMP scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QMP scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing storage metrics.

        - alert: KMEQGAScrapeErrors
          expr: |
            rate(kme_qga_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained QGA scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QGA scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing guest-side metrics.

        - alert: KMEKVMPollStale
          expr: time() - kme_kvm_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "KVM polling stale on {{ $labels.instance }}"
            description: >-
              The KVM subsystem has not completed a poll cycle in over 90 seconds.
              KVM exit/hypercall metrics from this node may be stale.

        - alert: KMEKVMScrapeErrors
          expr: |
            rate(kme_kvm_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained KVM scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent KVM debugfs scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing KVM metrics.

        - alert: KMECgroupPollStale
          expr: time() - kme_cgroup_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Cgroup polling stale on {{ $labels.instance }}"
            description: >-
              The cgroup subsystem has not completed a poll cycle in over 90 seconds.
              VMI memory and kernel thread CPU metrics from this node may be stale.

        - alert: KMECgroupScrapeErrors
          expr: |
            rate(kme_cgroup_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained cgroup scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent cgroup scrape errors
              (>0.1/s over 15 minutes). Some VMIs may be missing memory metrics.

        - alert: KMEeBPFSubsystemDown
          expr: kme_subsystem_active{subsystem="block"} == 0
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "eBPF block subsystem down on {{ $labels.instance }}"
            description: >-
              The block eBPF subsystem failed to load or has stopped.
              Node-side block I/O latency metrics are missing.

        - alert: KMEAbsent
          expr: absent(up{job="kubevirt-metrics-exporter"} == 1)
          # job label is set via jobLabel: app in the PodMonitor
          for: 10m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "kubevirt-metrics-exporter is down"
            description: >-
              No kubevirt-metrics-exporter metrics are being scraped. The
              DaemonSet may be down or the PodMonitor/scrape config broken.

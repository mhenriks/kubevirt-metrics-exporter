name: Test
on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev python3-yaml

      - name: Install promtool (OpenShift 4.20 baseline)
        env:
          PROMETHEUS_VERSION: 3.5.0
        run: |
          curl --fail --location --retry 3 -o /tmp/prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Generate eBPF bindings
        run: go generate ./pkg/ebpf/...

      - name: Check generated files are up to date
        run: |
          git diff --exit-code pkg/ebpf/ || (echo "Generated eBPF files are out of date. Run 'go generate ./pkg/ebpf/...' and commit." && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./...

      - name: Test Prometheus alert rules
        run: make test-alert-rules
